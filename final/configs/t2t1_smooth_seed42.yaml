experiment_name: residual_unet_t2t1_smooth_seed42

data:
  root: dataset/cn_project_t1t2
  manifest: dataset/cn_project_t1t2/paired_600_manifest.csv

task:
  direction: t2t1

split:
  mode: seed42
  seed: 42
  train_count: 480
  val_count: 60
  test_count: 60

normalization:
  method: zscore
  eps: 1e-8
  recompute: false

model:
  family: 3dunet
  name: 3DResidualUNet
  in_channels: 1
  out_channels: 1
  base_channels: 24
  transformer_layers: 2
  transformer_heads: 8
  transformer_dropout: 0.1

patch:
  size: [64, 128, 128]
  stride: [32, 64, 64]
  patches_per_case_per_epoch: 8
  val_patches_per_case: 1
  foreground_prob: 0.7

loss:
  l1_weight: 1.0
  ssim_weight: 0.4
  grad_weight: 0.2
  ssim_window: 7
  ssim_data_range: 4.0

training:
  epochs: 100
  batch_size: 32
  num_workers: 8
  lr: 0.0001
  weight_decay: 0.00001
  amp: true
  grad_clip_norm: 1.0
  save_every: 20
  val_every: 1
  fresh_start: true

inference:
  batch_size: 32
  amp: true
  clamp_minmax: true

output:
  root: output
  variant: smooth

runtime:
  seed: 42
  device: cuda
  gpu_ids: null
  deterministic: false
